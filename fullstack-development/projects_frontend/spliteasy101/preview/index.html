<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split Easy</title>
    <script src="./scripts.js" defer type="module"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Whole Number Division</h1>
      <form data-form="data-form">
        <label>
          <span>Dividend</span>
          <input name="dividend" placeholder="e.g. 10" />
        </label>
        <label>
          <span>Divider</span>
          <input name="divider" placeholder="e.g. 3" />
        </label>
        <button type="submit">Calculate</button>
      </form>
      <hr />
      <div data-result="data-result">No calculation performed</div>
    </div>
  </body>
</html>
